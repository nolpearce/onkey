# Builds the Windows downloads on Windows and attaches them to the release, so they always
# hold a freshly built Onkey.exe:
#   Onkey-Windows-Setup.exe  the download for people (an installer, from Windows/installer.iss)
#   Onkey-Windows.zip        what the in-app updater downloads; keep the name
# Runs when a release is published, or by hand for an existing tag (Actions > Windows
# release > Run workflow). On a pull request that touches the Windows build it only builds
# them and keeps them as the run's artifacts, for trying out before a release.
name: Windows release

on:
  release:
    types: [published]
  pull_request:
    paths:
      - Windows/**
      - Assets/**
      - .github/workflows/windows-release.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v4.5.0
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.sha }}

      - name: Check the version matches the tag
        if: env.TAG != ''
        shell: pwsh
        run: |
          $version = (Select-String -Path Windows/Source/Program.cs -Pattern 'Version = "(.*)";').Matches[0].Groups[1].Value
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or "v$version" -ne $env:TAG) {
            throw "Program.cs has version '$version' but the release tag is '$env:TAG'."
          }

      - name: Build Onkey.exe
        shell: cmd
        run: Windows\build.cmd

      - name: Make Onkey-Windows.zip
        shell: pwsh
        run: |
          $out = 'dist/Onkey-Windows'
          New-Item -ItemType Directory -Force "$out/Assets/Sounds", "$out/Source" | Out-Null
          Copy-Item Windows/Onkey.exe, Windows/README.txt $out
          Copy-Item Assets/Onkey.png "$out/Assets"
          Copy-Item Assets/Sounds/oooo.wav, Assets/Sounds/README.txt "$out/Assets/Sounds"
          # Onkey 4.4.3 and older only install an update that has Start Onkey.vbs and
          # Source\*.cs, and start it with wscript, so the zip keeps both. The .vbs just
          # starts Onkey.exe.
          Copy-Item Windows/Source/*.cs "$out/Source"
          $shim = @(
            "' Onkey now starts from Onkey.exe. This file lets older Onkeys update to it.",
            'Set shell = CreateObject("WScript.Shell")',
            'folder = CreateObject("Scripting.FileSystemObject").GetParentFolderName(WScript.ScriptFullName)',
            'shell.Run Chr(34) & folder & "\Onkey.exe" & Chr(34), 1, False'
          )
          Set-Content -Path "$out/Start Onkey.vbs" -Value $shim -Encoding ascii
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path $out), "$PWD/dist/Onkey-Windows.zip", 'Optimal', $true)
          $zip = [System.IO.Compression.ZipFile]::OpenRead("$PWD/dist/Onkey-Windows.zip")
          $zip.Entries | ForEach-Object { $_.FullName }
          $zip.Dispose()

      - name: Make Onkey-Windows-Setup.exe
        shell: pwsh
        run: |
          $version = (Select-String -Path Windows/Source/Program.cs -Pattern 'Version = "(.*)";').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Couldn't install Inno Setup." }
          }
          & $iscc /Qp "/DVersion=$version" Windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed." }
          Get-Item dist/Onkey-Windows-Setup.exe

      - name: Keep the downloads with this run
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: Onkey-Windows
          path: |
            dist/Onkey-Windows-Setup.exe
            dist/Onkey-Windows.zip

      - name: Attach to the release
        if: env.TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:TAG dist/Onkey-Windows-Setup.exe dist/Onkey-Windows.zip --clobber --repo ${{ github.repository }}
